name: Quality Heavy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  frontend-mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run bounded frontend mutation baseline
        working-directory: frontend
        run: npm run quality:mutation

      - name: Record backend mutation feasibility
        run: |
          mkdir -p .quality
          if command -v mull >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
            mull --version > .quality/mull-status.txt
          else
            printf '%s\n' 'BACKEND MUTATION: TOOLING NOT YET ACTIVE (Mull/Clang unavailable)' > .quality/mull-status.txt
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-mutation
          path: |
            .quality/mutation
            .quality/mull-status.txt
