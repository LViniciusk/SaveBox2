openapi: 3.0.3
info:
  title: Nanika API
  description: API do Nanika
  version: 1.0.0

servers:
  - url: /
    description: Servidor atual (Relativo)
  - url: http://localhost:8000
    description: Servidor local (Porta 8000)
  - url: http://localhost:8080
    description: Servidor local (Porta 8080)

tags:
  - name: Sistema
  - name: Documentação
  - name: Autenticação
  - name: Quota
  - name: Pastas
  - name: Arquivos
  - name: Árvore
  - name: Compartilhamento
  - name: Lixeira
  - name: Google Drive
    description: Provedor privado. Operações autenticadas são suportadas, mas compartilhamento público não é oferecido e o backend não atua como proxy de mídia. Arquivos armazenados no Google Drive não podem criar links públicos Nanika.
  - name: Armazenamento
    description: Projeção lógica dos provedores e movimentações físicas de arquivos criptografados.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_code:
          type: string
      required: [error]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: online

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string

    VaultVerificationRequest:
      type: object
      required: [vault_verification]
      properties:
        vault_verification:
          type: string
          maxLength: 16384
          description: Ciphertext de verificação; nunca contém a frase ou a Vault Key em claro.

    VaultVerificationResponse:
      type: object
      required: [vault_verification]
      properties:
        vault_verification:
          type: string

    GoogleLoginRequest:
      type: object
      required: [id_token, nonce]
      properties:
        id_token:
          type: string
        nonce:
          type: string

    CreateFolderRequest:
      type: object
      required: [encrypted_name, name_hash]
      properties:
        parent_id:
          type: integer
          nullable: true
          format: int64
        encrypted_name:
          type: string
        name_hash:
          type: string

    CreateFolderResponse:
      type: object
      properties:
        message:
          type: string
        id:
          type: integer
          format: int64

    InitUploadRequest:
      type: object
      required: [encrypted_name, name_hash, encrypted_fdk, size_bytes]
      properties:
        folder_id:
          type: integer
          nullable: true
          description: Opcional
        encrypted_name:
          type: string
        name_hash:
          type: string
        encrypted_fdk:
          type: string
        size_bytes:
          type: integer
        total_chunks:
          type: integer
          description: Necessário para o armazenamento local.
        storage_provider:
          type: string
          enum: [local, google_drive]
          default: local

    InitUploadResponse:
      type: object
      properties:
        file_id:
          type: integer
        storage_provider:
          type: string
    BatchInitUploadItemRequest:
      allOf:
        - $ref: '#/components/schemas/InitUploadRequest'
        - type: object
          required: [client_ref]
          properties:
            client_ref:
              type: string
              minLength: 1
              maxLength: 128
              description: Identificador opaco transitório usado apenas para correlacionar o item dentro da requisição em lote.

    BatchInitUploadRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BatchInitUploadItemRequest'
          maxItems: 100

    BatchInitUploadItemResponse:
      type: object
      required: [client_ref, file_id, name_hash, storage_provider]
      properties:
        client_ref:
          type: string
          minLength: 1
          maxLength: 128
          description: Mesmo identificador opaco recebido no item correspondente da requisição.
        file_id:
          type: integer
        name_hash:
          type: string
        storage_provider:
          type: string
          enum: [local, google_drive]

    BatchInitUploadResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/BatchInitUploadItemResponse'

    BatchDeleteRequest:
      type: object
      required: [file_ids]
      properties:
        file_ids:
          type: array
          items:
            type: integer
          maxItems: 100

    ChunkUploadStatus:
      type: object
      properties:
        status:
          type: string
          enum: [uploading, completed]

    UploadedChunksResponse:
      type: object
      properties:
        uploaded_chunks:
          type: array
          items:
            type: integer

    GenericMessageResponse:
      type: object
      properties:
        message:
          type: string

    ShareResponse:
      type: object
      properties:
        share_uuid:
          type: string
          description: codigo de 7 caracteres para acesso público.

    SharedFileMetadata:
      type: object
      required: [encrypted_name, size_bytes, storage_provider]
      properties:
        encrypted_name:
          type: string
          description: Nome protegido pela FDK do compartilhamento.
        size_bytes:
          type: integer
          format: int64
        storage_provider:
          type: string
          enum: [local]

    GoogleDriveSharingUnsupported:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          example: Compartilhamento publico nao esta disponivel para arquivos armazenados no Google Drive.
        code:
          type: string
          enum: [GOOGLE_DRIVE_SHARING_UNSUPPORTED]

    StorageTarget:
      type: object
      required: [key, provider, label, used_bytes, nanika_used_bytes, status]
      properties:
        key: { type: string, example: local }
        provider: { type: string, enum: [local, google_drive] }
        label: { type: string }
        external_storage_id: { type: integer, format: int64, nullable: true }
        account_email: { type: string }
        account_picture: { type: string, format: uri, nullable: true }
        used_bytes: { type: integer, format: int64 }
        max_bytes: { type: integer, format: int64, nullable: true }
        available_bytes: { type: integer, format: int64, nullable: true }
        nanika_used_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [ready, unavailable, unlinking] }

    StorageMoveItem:
      type: object
      required: [id, file_id, role, total_bytes, transferred_bytes, status]
      properties:
        id: { type: integer, format: int64 }
        file_id: { type: integer, format: int64 }
        role: { type: string, enum: [original, proxy] }
        source_external_file_id: { type: string }
        target_external_file_id: { type: string }
        total_bytes: { type: integer, format: int64 }
        transferred_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [prepared, transferring, target_uploaded, completed, cancelled, failed] }

    StorageMoveJob:
      type: object
      required: [id, file_id, status, source_provider, target_provider, total_bytes, transferred_bytes, is_retryable, items]
      properties:
        id: { type: integer, format: int64 }
        file_id: { type: integer, format: int64 }
        status: { type: string, enum: [prepared, transferring, paused, target_uploaded, committing, cleanup_pending, completed, cancelled, failed] }
        source_provider: { type: string, enum: [local, google_drive] }
        source_external_storage_id: { type: integer, format: int64, nullable: true }
        target_provider: { type: string, enum: [local, google_drive] }
        target_external_storage_id: { type: integer, format: int64, nullable: true }
        total_bytes: { type: integer, format: int64 }
        transferred_bytes: { type: integer, format: int64 }
        is_retryable: { type: boolean }
        failure_stage: { type: string, nullable: true, enum: [prepare, source_metadata, source_read, target_session, target_write, target_ack, commit, cleanup] }
        error_code: { type: string }
        error_detail: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/StorageMoveItem' }

paths:
  /api/docs:
    get:
      tags: [Documentação]
      summary: Interface Swagger UI
      description: Retorna o HTML com a interface Swagger UI.
      responses:
        '200':
          description: HTML da documentação
          content:
            text/html:
              schema:
                type: string

  /api/docs/swagger.yaml:
    get:
      tags: [Documentação]
      summary: Especificação OpenAPI em YAML
      description: Retorna o arquivo swagger.yaml servido pela API.
      responses:
        '200':
          description: Especificação YAML
          content:
            text/yaml:
              schema:
                type: string
        '404':
          description: Arquivo não encontrado

  /health:
    get:
      tags: [Sistema]
      summary: Health check da API
      responses:
        '200':
          description: API online
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /register:
    post:
      tags: [Autenticação]
      summary: Cadastro de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Usuário já existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Limite de criação de contas por IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Falha temporária no envio do e-mail; a tentativa de cadastro não foi retida e pode ser repetida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno

  /verify:
    get:
      tags: [Autenticação]
      summary: Verificação de e-mail e ativação de conta
      parameters:
        - name: codigo
          in: query
          required: true
          schema:
            type: string
            description: codigo de 6 caracteres. TTL de 5 minutos.
      responses:
        '200':
          description: Conta ativada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '400':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Bloqueio temporário (Força Bruta)
        '500':
          description: Erro interno

  /logout:
    post:
      tags: [Autenticação]
      summary: Invalidação da sessão atual (Dispositivo local)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessão local invalidada (JTI removido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '401':
          description: Token ausente, inválido ou revogado

  /logout/global:
    post:
      tags: [Autenticação]
      summary: Invalidação global (Kill Switch) para todos os dispositivos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todas as sessões invalidadas (Token version incrementado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '401':
          description: Token ausente, inválido ou revogado

  /login:
    post:
      tags: [Autenticação]
      summary: Login e emissão de JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login efetuado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: JSON inválido
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Conta não verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno

  /api/auth/google:
    post:
      tags: [Autenticação]
      summary: Login via Google OAuth2
      description: Realiza a autenticação/registro silencioso usando o token ID enviado pelo Google.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Login efetuado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Parâmetro id_token inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflito de provedor de credencial (e.g. e-mail já cadastrado via password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
        '502':
          description: API do Google indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/vault/init:
    post:
      tags: [Autenticação]
      summary: Cria ou atualiza a verificação criptografada do cofre
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultVerificationRequest' }
      responses:
        '204': { description: Verificação persistida }
        '400': { description: vault_verification ausente, vazio, inválido ou excedendo o limite }
        '401': { description: Token ausente ou inválido }

  /api/vault/verification:
    get:
      tags: [Autenticação]
      summary: Obtém a verificação criptografada do cofre
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ciphertext de verificação; não contém a frase nem material de chave em claro.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
            Pragma:
              schema: { type: string, example: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultVerificationResponse' }
        '401': { description: Token ausente ou inválido }
        '404': { description: Cofre ainda não inicializado }

  /users/me/quota:
    get:
      tags: [Quota]
      summary: Obtém quota do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quota retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Token ausente ou inválido
        '500':
          description: Erro interno

  /folders/batch-delete:
    delete:
      tags: [Pastas]
      summary: Envia múltiplas pastas para a lixeira
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_ids:
                  type: array
                  items:
                    type: integer
                  description: Array com até 100 IDs de pastas
      responses:
        '200':
          description: Pastas processadas com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  deleted_count:
                    type: integer
        '400':
          description: Formato inválido ou limite excedido
        '401':
          description: Não autorizado
        '500':
          description: Erro interno do servidor

  /folders:
    post:
      tags: [Pastas]
      summary: Cria uma pasta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: Pasta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFolderResponse'
        '400':
          description: JSON inválido
        '401':
          description: Token ausente ou inválido
        '409':
          description: Pasta já existe no mesmo diretório
        '500':
          description: Erro interno

  /folders/pinned:
    get:
      tags: [Pastas]
      summary: Lista as pastas fixadas do usuário
      description: Retorna somente IDs e posições. Pastas em soft delete são ocultadas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista ordenada de pastas fixadas
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [folder_id, position]
                      properties:
                        folder_id:
                          type: integer
                          format: int64
                        position:
                          type: integer
        '401':
          description: Token ausente ou inválido
        '500':
          description: Erro interno

  /folders/pinned/order:
    put:
      tags: [Pastas]
      summary: Reordena as pastas fixadas
      description: A lista deve representar exatamente o conjunto atual de pins, sem duplicidades.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder_ids]
              additionalProperties: false
              properties:
                folder_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                    minimum: 1
      responses:
        '204':
          description: Ordem atualizada
        '400':
          description: JSON inválido, IDs duplicados ou conjunto diferente dos pins atuais
        '401':
          description: Token ausente ou inválido
        '500':
          description: Erro interno

  /folders/{folderId}/pin:
    put:
      tags: [Pastas]
      summary: Fixa uma pasta
      description: Operação idempotente; a pasta é adicionada ao final da lista.
      security:
        - bearerAuth: []
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Pasta fixada
        '401':
          description: Token ausente ou inválido
        '403':
          description: Pasta pertence a outro usuário
        '404':
          description: Pasta inexistente ou em soft delete
        '500':
          description: Erro interno
    delete:
      tags: [Pastas]
      summary: Remove uma pasta fixada
      description: Operação idempotente para uma pasta própria; as posições restantes são normalizadas.
      security:
        - bearerAuth: []
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Pasta desafixada
        '401':
          description: Token ausente ou inválido
        '403':
          description: Pasta pertence a outro usuário
        '404':
          description: Pasta inexistente ou em soft delete
        '500':
          description: Erro interno

  /folders/{folderId}/contents:
    get:
      tags: [Pastas]
      summary: Lista conteúdo de uma pasta
      security:
        - bearerAuth: []
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Conteúdo da pasta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Token ausente ou inválido
        '404':
          description: Pasta não encontrada
        '500':
          description: Erro interno

  /folders/{folderId}:
    delete:
      tags: [Pastas]
      summary: Move pasta para a lixeira
      security:
        - bearerAuth: []
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pasta movida para lixeira
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '401':
          description: Token ausente ou inválido
        '403':
          description: Proibido
        '404':
          description: Pasta não encontrada
        '500':
          description: Erro interno
    put:
      tags: [Pastas]
      summary: Atualiza nome e/ou pai da pasta
      security:
        - bearerAuth: []
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                encrypted_name:
                  type: string
                name_hash:
                  type: string
                parent_id:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Pasta atualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Requisição inválida
        '401':
          description: Token ausente ou inválido
        '403':
          description: Proibido
        '404':
          description: Não encontrada
        '500':
          description: Erro interno

  /folders/{folderId}/restore:
    post:
      tags: [Lixeira]
      summary: Restaura pasta da lixeira
      security:
        - bearerAuth: []
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pasta restaurada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '401':
          description: Token ausente ou inválido
        '404':
          description: Pasta não encontrada na lixeira
        '409':
          description: Conflito no destino
        '500':
          description: Erro interno

  /files/batch-init:
    post:
      tags: [Arquivos]
      summary: Inicializa upload de multiplos arquivos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInitUploadRequest'
      responses:
        '201':
          description: Uploads inicializados
          headers:
            Cache-Control:
              description: Presente quando a resposta contém credenciais efêmeras do Google Drive; respostas Local não carregam credenciais.
              schema: { type: string, example: no-store }
            Pragma:
              description: Presente quando a resposta contém credenciais efêmeras do Google Drive.
              schema: { type: string, example: no-cache }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchInitUploadResponse'
        '400':
          description: JSON inválido
        '401':
          description: Token ausente ou inválido
        '402':
          description: Quota excedida
        '507':
          description: Capacidade insuficiente nas contas Google Drive vinculadas
        '409':
          description: Arquivo já existe na pasta ou a conta Google foi desvinculada durante a inicialização
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /files/batch-delete:
    delete:
      tags: [Arquivos]
      summary: Envia multiplos arquivos para a lixeira
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteRequest'
      responses:
        '200':
          description: Arquivos processados
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_count:
                    type: integer
        '400':
          description: Lote excede limite ou invalido
        '401':
          description: Token ausente ou invalido
        '500':
          description: Erro interno

  /files:
    post:
      tags: [Arquivos]
      summary: Inicializa upload de arquivo em chunks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitUploadRequest'
      responses:
        '201':
          description: Upload inicializado
          headers:
            Cache-Control:
              description: Presente quando a resposta contém credenciais efêmeras do Google Drive; respostas Local não carregam credenciais.
              schema: { type: string, example: no-store }
            Pragma:
              description: Presente quando a resposta contém credenciais efêmeras do Google Drive.
              schema: { type: string, example: no-cache }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitUploadResponse'
        '400':
          description: JSON inválido
        '401':
          description: Token ausente ou inválido
        '402':
          description: Quota excedida
        '409':
          description: Arquivo já existe na pasta ou a conta Google foi desvinculada durante a inicialização
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno

  /files/{fileId}/chunks:
    post:
      tags: [Arquivos]
      summary: Envia um chunk de arquivo
      security:
        - bearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
        - name: X-Chunk-Index
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Chunk processado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkUploadStatus'
        '400':
          description: Chunk inválido, incluindo cabeçalho ou índice inválido e tamanho incompatível com o upload reservado
        '401':
          description: Token ausente ou inválido
        '500':
          description: Erro interno

  /files/{fileId}/uploaded-chunks:
    get:
      tags: [Arquivos]
      summary: Lista chunks já enviados de um upload
      security:
        - bearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chunks enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedChunksResponse'
        '400':
          description: Upload já finalizado
        '401':
          description: Token ausente ou inválido
        '404':
          description: Arquivo não encontrado
        '500':
          description: Erro interno

  /pending-uploads:
    get:
      tags: [Arquivos]
      summary: Lista todos os uploads de arquivos incompletos do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de uploads pendentes retornada
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_uploads:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        folder_id:
                          type: integer
                          nullable: true
                        encrypted_name:
                          type: string
                        size_bytes:
                          type: integer
                        total_chunks:
                          type: integer
                        encrypted_fdk:
                          type: string
        '401':
          description: Token ausente ou inválido
        '500':
          description: Erro interno

  /files/{fileId}/pending-upload-recovery-prefix:
    get:
      tags: [Arquivos]
      summary: Recupera prefixo limitado de um upload Local pendente
      description: >
        Endpoint de recuperação owner-scoped para retomar um upload Local incompleto.
        Exige exclusivamente um Range no formato bytes=0-N, lê somente ciphertext do
        arquivo físico e não altera o estado do upload. Não substitui nem flexibiliza
        o endpoint normal de download. O limite de N é FileChunker::MAX_CHUNK_SIZE - 1
        (4 MiB - 1 nesta configuração).
      security:
        - bearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: integer }
        - name: Range
          in: header
          required: true
          schema: { type: string, example: bytes=0-131071 }
          description: Somente um prefixo fechado bytes=0-N; sem suffix, range aberto ou multi-range.
      responses:
        '206':
          description: Prefixo de ciphertext retornado
          headers:
            Content-Range:
              description: Intervalo real retornado e tamanho físico atual.
              schema: { type: string, example: bytes 0-131071/1048576 }
            Content-Length:
              schema: { type: integer, format: int64 }
            Accept-Ranges:
              schema: { type: string, example: bytes }
            Cache-Control:
              schema: { type: string, example: no-store }
            Pragma:
              schema: { type: string, example: no-cache }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: Range ausente ou arquivo não pertence ao armazenamento Local
        '401':
          description: Token ausente ou inválido
        '404':
          description: Arquivo não encontrado ou não pertence ao usuário
        '409':
          description: Upload concluído, chunk zero/contexto indisponível ou arquivo físico ausente
        '416':
          description: Range inválido, não prefixado em zero ou acima do limite
        '503':
          description: Recurso de armazenamento indisponível
        '500':
          description: Erro interno

  /files/{fileId}/download:
    get:
      tags: [Arquivos]
      summary: Download de arquivo (com suporte a Range)
      security:
        - bearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: Exemplo bytes=0-1023
      responses:
        '200':
          description: Conteúdo completo Local ou metadados de download Google. Cache-Control no-store/Pragma no-cache são presentes quando a resposta contém access_token.
          headers:
            Cache-Control:
              description: Presente quando a resposta contém credenciais efêmeras do Google Drive; respostas Local não carregam credenciais.
              schema: { type: string, example: no-store }
            Pragma:
              description: Presente quando a resposta contém credenciais efêmeras do Google Drive.
              schema: { type: string, example: no-cache }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                properties:
                  storage_provider:
                    type: string
                  external_file_id:
                    type: string
                  access_token:
                    type: string
        '206':
          description: Conteúdo parcial
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Upload incompleto
        '401':
          description: Token ausente ou inválido
        '404':
          description: Arquivo não encontrado
        '416':
          description: Range inválido
        '500':
          description: Erro interno

  /files/{fileId}:
