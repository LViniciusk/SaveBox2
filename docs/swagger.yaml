      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
        '401':
          description: Token ausente ou inválido
        '500':
          description: Erro interno

  /api/storage/google/link:
    post:
      tags: [Google Drive]
      summary: Vincula conta do Google Drive
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_code, state]
              properties:
                auth_code:
                  type: string
                  description: Authorization code retornado pelo Google OAuth
                state:
                  type: string
                  description: O token CSRF (state) gerado previamente pela API
      responses:
        '200':
          description: Conta vinculada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  root_folder_id:
                    type: string
                  account_email:
                    type: string
        '400':
          description: Falha na troca do token ou JSON inválido
        '401':
          description: Token ausente ou inválido
        '409':
          description: Conta já vinculada
        '500':
          description: Erro interno

  /api/storage/google/accounts:
    get:
      tags: [Google Drive]
      summary: Obtém a lista de contas do Google Drive vinculadas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de contas
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        account_email:
                          type: string
                        root_folder_id:
                          type: string
        '401':
          description: Token ausente ou inválido
        '500':
          description: Erro interno

  /api/storage/google/accounts/{accountId}:
    delete:
      tags: [Google Drive]
      summary: Desvincula uma conta do Google Drive específica
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
          description: O ID da conta externa
      responses:
        '200':
          description: Conta desvinculada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '401':
          description: Token ausente ou inválido
        '404':
          description: Conta não encontrada ou não pertence ao usuário
        '409':
          description: Conta possui transferências de armazenamento ativas ou uploads Google pendentes
        '500':
          description: Erro interno

  /files/{fileId}/finalize-external:
    post:
      tags: [Google Drive]
      summary: Finaliza o registro de um upload feito externamente no Google Drive
      security:
        - bearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                external_file_id:
                  type: string
                  description: ID retornado pela API do Google Drive
      responses:
        '200':
          description: Upload externo finalizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '400':
          description: Arquivo não é do tipo google_drive ou JSON inválido
        '401':
          description: Token ausente ou inválido
        '403':
          description: Sem permissão para alterar o arquivo
        '404':
          description: Arquivo não encontrado
        '409':
          description: Upload já concluído ou conflito no ciclo de vida do armazenamento externo
        '500':
          description: Erro interno

  /files/{fileId}/external-upload-recovery-context:
    get:
      tags: [Google Drive]
      summary: Retorna contexto efêmero para recuperar upload Google pendente
      description: >
        Retorna apenas o contexto mínimo e efêmero necessário ao frontend para retomar
        um upload Google Drive pendente. É owner-scoped, não retorna refresh_token ou
        client_secret, usa Cache-Control no-store e Pragma no-cache e não transporta
        bytes de mídia nem funciona como proxy.
      security:
        - bearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Contexto efêmero de recovery
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
            Pragma:
              schema: { type: string, example: no-cache }
          content:
            application/json:
              schema:
                type: object
                required: [storage_provider, external_storage_id, name_hash]
                properties:
                  storage_provider: { type: string, example: google_drive }
                  external_storage_id: { type: integer }
                  name_hash: { type: string, description: Identificador opaco do nome criptografado }
        '400':
          description: Arquivo não pertence ao Google Drive
        '401':
          description: Token ausente ou inválido
        '404':
          description: Arquivo não encontrado
        '409':
          description: Upload, conta ou armazenamento externo indisponível
        '500':
          description: Erro interno

  /files/{fileId}/external-upload-session:
    post:
      tags: [Google Drive]
      summary: Reconcilia um upload Google pendente e cria uma sessão resumable
      description: >
        Consulta primeiro objetos externos associados ao arquivo pendente. Retorna
        um objeto concluído quando há exatamente um candidato válido ou uma sessão
        resumable e um token efêmero para o upload direto do navegador ao Google Drive.
        O backend não transporta os bytes do arquivo.
      security:
        - bearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Resultado da reconciliação e da criação da sessão
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
            Pragma:
              schema: { type: string, example: no-cache }
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status, session_uri, access_token]
                    properties:
                      status: { type: string, enum: [upload] }
                      session_uri: { type: string, format: uri }
                      access_token: { type: string, description: Token efêmero para o upload direto ao Google Drive }
                  - type: object
                    required: [status, external_file_id]
                    properties:
                      status: { type: string, enum: [completed] }
                      external_file_id: { type: string }
        '401':
          description: Token ausente ou inválido
        '403':
          description: Origem não permitida
        '404':
          description: Arquivo não encontrado
        '409':
          description: Upload já concluído, storage indisponível ou reconciliação ambígua
        '502':
          description: Falha ao reconciliar ou criar sessão no Google Drive
        '500':
          description: Erro interno

  /files/{fileId}/external-upload-cancel:
    post:
      tags: [Google Drive]
      summary: Marca um upload Google pendente para cleanup assíncrono
      description: >
        Registra o cancelamento no control plane local. O backend não recebe
        sessão resumable, token, FDK ou bytes de mídia; a reconciliação e a
        eventual remoção do objeto externo são realizadas pelo Garbage Collector.
      security:
        - bearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '202':
          description: Cancelamento registrado para cleanup posterior
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
            Pragma:
              schema: { type: string, example: no-cache }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [cleanup_pending] }
        '400':
          description: Arquivo não pertence ao Google Drive
        '401':
          description: Token ausente ou inválido
        '404':
          description: Arquivo não encontrado
        '409':
          description: Upload já finalizado ou conta Google indisponível
        '500':
          description: Erro interno

  /api/storage/google/accounts/{accountId}/sync-map:
    get:
      tags: [Google Drive]
      summary: Obtém o mapa de arquivos no Drive associados a uma conta
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Mapa de sincronização obtido
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        external_file_id:
                          type: string
        '401':
          description: Token ausente ou inválido
        '500':
          description: Erro interno

  /api/storage/google/accounts/{accountId}/sync-cleanup:
    post:
      tags: [Google Drive]
      summary: Informa quais arquivos estão ausentes na nuvem para realizar limpeza local (Soft Delete)
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                missing_external_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Limpeza executada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '400':
          description: Requisição inválida
        '401':
          description: Token ausente ou inválido
        '500':
          description: Erro interno

  /api/storage/targets:
    get:
      tags: [Armazenamento]
      summary: Lista o armazenamento local e todas as contas Google vinculadas
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Destinos e quotas disponíveis
          content:
            application/json:
              schema:
                type: object
                properties:
                  targets:
                    type: array
                    items: { $ref: '#/components/schemas/StorageTarget' }
        '401': { description: Token ausente ou inválido }

  /api/storage/tree:
    get:
      tags: [Armazenamento]
      summary: Projeta a árvore lógica de um armazenamento
      description: Retorna apenas metadados criptografados pertencentes ao usuário; não lê bytes do provedor.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string, enum: [local, google_drive] } }
        - { name: external_storage_id, in: query, schema: { type: integer, format: int64 } }
        - { name: folder_id, in: query, schema: { type: integer, format: int64 } }
        - { name: file_limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: file_offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200': { description: Árvore projetada }
        '400': { description: Parâmetros inválidos }
        '401': { description: Token ausente ou inválido }
        '404': { description: Armazenamento ou pasta não encontrado }

  /files/{fileId}/storage-moves:
    post:
      tags: [Armazenamento]
      summary: Inicia a movimentação física de um arquivo criptografado
      description: Reserva quota e cria um job persistente. Pastas e lotes não são aceitos nesta versão.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_provider]
              properties:
                target_provider: { type: string, enum: [local, google_drive] }
                target_external_storage_id: { type: integer, format: int64 }
      responses:
        '201': { description: Job criado, content: { application/json: { schema: { $ref: '#/components/schemas/StorageMoveJob' } } } }
        '400': { description: Destino inválido ou quota insuficiente }
        '401': { description: Token ausente ou inválido }
        '404': { description: Arquivo ou destino não encontrado }
        '409': { description: Arquivo compartilhado, mesmo destino ou job já ativo }
        '502': { description: Provedor indisponível }

  /storage-moves/active:
    get:
      tags: [Armazenamento]
      summary: Lista movimentações ainda recuperáveis pelo cliente
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Jobs ativos
          content:
            application/json:
              schema:
                type: object
                properties:
                  moves: { type: array, items: { $ref: '#/components/schemas/StorageMoveJob' } }
        '401': { description: Token ausente ou inválido }

  /storage-moves/{moveId}:
    parameters:
      - { name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Armazenamento]
      summary: Consulta uma movimentação
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Estado persistido, content: { application/json: { schema: { $ref: '#/components/schemas/StorageMoveJob' } } } }
        '404': { description: Job não encontrado }
    delete:
      tags: [Armazenamento]
      summary: Cancela uma movimentação de forma idempotente
      description: A origem permanece válida. IDs Google conhecidos pelo cliente são revalidados antes da limpeza; mesmo sem um ID, o backend mantém reconciliação tardia por markers opacos. A limpeza pode continuar após esta resposta e não transforma o backend em proxy de arquivos.
      security: [{ bearerAuth: [] }]
      requestBody:
        description: IDs de alvos Google conhecidos apenas em memória; cada ID é revalidado pelo backend.
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [item_id, target_external_file_id]
                    properties:
                      item_id: { type: integer, format: int64 }
                      target_external_file_id: { type: string }
      responses:
        '200': { description: Job cancelado; a operação é idempotente e o cleanup tardio pode continuar, content: { application/json: { schema: { $ref: '#/components/schemas/StorageMoveJob' } } } }
        '404': { description: Job não encontrado }
        '409': { description: Estado incompatível }

  /storage-moves/{moveId}/pause:
    post:
      tags: [Armazenamento]
      summary: Pausa uma movimentação
      security: [{ bearerAuth: [] }]
      parameters: [{ name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Job pausado, content: { application/json: { schema: { $ref: '#/components/schemas/StorageMoveJob' } } } }
        '409': { description: Estado incompatível }

  /storage-moves/{moveId}/resume:
    post:
      tags: [Armazenamento]
      summary: Retoma uma movimentação
      security: [{ bearerAuth: [] }]
      parameters: [{ name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Job retomado, content: { application/json: { schema: { $ref: '#/components/schemas/StorageMoveJob' } } } }
        '409': { description: Estado incompatível }

  /storage-moves/{moveId}/clear:
    delete:
      tags: [Armazenamento]
      summary: Remove um job terminal já limpo
      description: Retorna 409 enquanto houver staging, deleção externa ou reconciliação Google tardia pendente. O job não pode ser removido antes de o GC manter a capacidade de encontrar targets materializados posteriormente.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '204': { description: Job removido }
        '409': { description: Job não terminal ou limpeza ainda pendente }

  /storage-moves/{moveId}/failure:
    post:
      tags: [Armazenamento]
      summary: Persiste uma falha recuperável ou terminal
      security: [{ bearerAuth: [] }]
      parameters: [{ name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [error_code, stage, retryable]
              properties:
                error_code: { type: string, enum: [SOURCE_READ_FAILED, GOOGLE_TARGET_SESSION_FAILED, GOOGLE_TARGET_WRITE_FAILED, GOOGLE_TARGET_ACK_FAILED, LOCAL_TARGET_WRITE_FAILED, STORAGE_MOVE_NETWORK_FAILED, STORAGE_MOVE_TARGET_INCOMPLETE, STORAGE_MOVE_INVALID_STATE] }
                stage: { type: string, enum: [prepare, source_metadata, source_read, target_session, target_write, target_ack, commit, cleanup] }
                retryable: { type: boolean }
                items: { type: array, items: { type: object, required: [item_id, target_external_file_id], properties: { item_id: { type: integer, format: int64 }, target_external_file_id: { type: string } } } }
      responses:
        '200': { description: Estado canônico persistido, content: { application/json: { schema: { $ref: '#/components/schemas/StorageMoveJob' } } } }
        '409': { description: Falha inválida ou estado incompatível }

  /storage-moves/{moveId}/progress:
    post:
      tags: [Armazenamento]
      summary: Persiste o progresso de um item
      security: [{ bearerAuth: [] }]
      parameters: [{ name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id, transferred_bytes]
              properties:
                item_id: { type: integer, format: int64 }
                transferred_bytes: { type: integer, format: int64 }
      responses:
        '200': { description: Progresso persistido, content: { application/json: { schema: { $ref: '#/components/schemas/StorageMoveJob' } } } }

  /storage-moves/{moveId}/items/{itemId}/chunks/{chunkIndex}:
    put:
      tags: [Armazenamento]
      summary: Envia um chunk criptografado para staging local
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: chunkIndex, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '200': { description: Chunk persistido }
        '400': { description: Chunk maior que 4 MiB ou estado inválido }

  /storage-moves/{moveId}/items/{itemId}/uploaded-chunks:
    get:
      tags: [Armazenamento]
      summary: Lista chunks locais já persistidos
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Índices dos chunks }

  /storage-moves/{moveId}/items/{itemId}/source:
    get:
      tags: [Armazenamento]
      summary: Lê um Range local ou obtém autorização curta para leitura direta do Google
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: Range, in: header, schema: { type: string, example: bytes=0-4194303 } }
      responses:
        '200':
          description: Metadados de origem Google para transferência direta no navegador
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
            Pragma:
              schema: { type: string, example: no-cache }
        '206': { description: Range criptografado da origem local; exige `bytes=início-fim` único de até 4 MiB. }
        '416': { description: Range inválido ou maior que 4 MiB; retorna `Content-Range: bytes */total`. }

  /storage-moves/{moveId}/items/{itemId}/google-session:
    post:
      tags: [Armazenamento]
      summary: Cria uma sessão resumível na raiz Google de destino
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: URI da sessão e autorização curta; não são persistidas nem registradas em log
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
            Pragma:
              schema: { type: string, example: no-cache }
        '502': { description: Google Drive indisponível }

  /storage-moves/{moveId}/items/{itemId}/target-uploaded:
    post:
      tags: [Armazenamento]
      summary: Confirma um destino já enviado
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_external_file_id: { type: string, description: Obrigatório para destino Google; omitido para destino local. }
      responses:
        '200': { description: ACK idempotente com estado canônico, content: { application/json: { schema: { $ref: '#/components/schemas/StorageMoveJob' } } } }
        '409': { description: Destino ausente, divergente ou inválido }

  /storage-moves/{moveId}/reconcile:
    post:
      tags: [Armazenamento]
      summary: Reconcilia alvos Google após interrupção
      security: [{ bearerAuth: [] }]
      parameters: [{ name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Estado reconciliado, content: { application/json: { schema: { $ref: '#/components/schemas/StorageMoveJob' } } } }
        '502': { description: Falha ao consultar o Google Drive }

  /storage-moves/{moveId}/complete:
    post:
      tags: [Armazenamento]
      summary: Valida o alvo e troca atomicamente o provedor do arquivo
      security: [{ bearerAuth: [] }]
      parameters: [{ name: moveId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Commit concluído ou limpeza assíncrona agendada, content: { application/json: { schema: { $ref: '#/components/schemas/StorageMoveJob' } } } }
        '400': { description: Destino incompleto }
        '409': { description: Estado incompatível }
        '500': { description: Falha interna de commit; detalhes do filesystem não são expostos }
