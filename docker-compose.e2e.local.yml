services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nanika_e2e
      POSTGRES_PASSWORD: nanika_m6_local_only
      POSTGRES_DB: nanika_e2e_m6
    ports:
      - "127.0.0.1:25433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanika_e2e -d nanika_e2e_m6"]
      interval: 1s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: nanika_e2e
      DB_PASSWORD: nanika_m6_local_only
      DB_NAME: nanika_e2e_m6
      PASS_PEPPER: nanika_e2e_test_pepper
      NANIKA_JWT_SECRET: nanika_e2e_test_jwt_secret
      RESEND_API_KEY: nanika_e2e_test_resend
      EMAIL_VALIDATION_API_KEY: nanika_e2e_test_email
      GOOGLE_CLIENT_ID: nanika-e2e-test-client
      GOOGLE_CLIENT_SECRET: nanika-e2e-test-secret
      IMGUR_CLIENT_ID: nanika-e2e-test-imgur
      NANIKA_STORAGE_PATH: /app/nanika_storage
      NANIKA_E2E_STORAGE_ID: ${NANIKA_E2E_STORAGE_ID:?Set a fresh E2E storage identity before starting this stack}
      CORS_ORIGIN: http://localhost:4200
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      PORT: "8080"
    volumes:
      - type: bind
        source: ./.quality/b89-r2m6-cleanup-slider/storage
        target: /app/nanika_storage
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /app/nanika_storage/.nanika-e2e-storage-id && test "$$(cat /app/nanika_storage/.nanika-e2e-storage-id)" = "$$NANIKA_E2E_STORAGE_ID"
      interval: 1s
      timeout: 3s
      retries: 30
